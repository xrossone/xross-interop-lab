[package]
name = "proto-airplay"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# AirPlay legacy receiver 的控制链核心（plans/03 T32）。
# 只含协议无关的 framing/状态机/能力门禁；**不含任何 FairPlay/设备认证材料**
# （密钥获取经 keying seam，生产实现缺席 = 能力缺席）。
[dependencies]
interop-contract = { path = "../../crates/interop-contract" }
interop-ipc = { path = "../../crates/interop-ipc" }
interop-media = { path = "../../crates/interop-media" }
# serde/serde_json 只用于**配对登记表**的状态序列化（T34），不承载任何协议语义；
# 字段含义全部按 specs-reviewed/m01 的字段表逐条校验。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
